name: Claude traite une tâche Radar

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - memoire/TACHES.md

permissions:
  contents: read

jobs:
  claude:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'radar-task/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: radar-task-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Confirm exactly one new task
        id: task
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF" --no-tags --depth=1
          count="$(git diff --unified=0 "origin/$BASE_REF...HEAD" -- memoire/TACHES.md | awk 'substr($0, 1, 7) == "+- [ ] " { n++ } END { print n + 0 }')"
          if [ "$count" = "1" ]; then
            echo "run_claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_claude=false" >> "$GITHUB_OUTPUT"
            echo "Expected exactly one newly added unchecked task; found $count. Claude was not started." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Claude credentials
        if: steps.task.outputs.run_claude == 'true'
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "Add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN under repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run Claude on the task
        if: steps.task.outputs.run_claude == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are Claude, the developer for Radar Steelbook. Read memoire/LISEZ-MOI.md first and follow its required reading order: PROJET.md, REGLES.md, TACHES.md, then the last 10 lines of JOURNAL.md.

            In the pull request diff, find the single newly added unchecked task in memoire/TACHES.md. Work only on that task and on this pull request branch. Do not merge the pull request or push to main.

            Respect REGLES.md and CHECKLIST_QUALITE.md. Do not open, click, or test Amazon affiliate links. Do not change affiliate links or invent release dates. Do not display prices. Do not send emails or publish to TikTok; Antho handles those actions. Do not put secrets or personal data in the public repository. If the task needs an Antho decision, account access, or missing credential, leave it unchecked and report the blocker in the pull request.

            When the task is complete, check only that task in TACHES.md, add a dated entry to JOURNAL.md, and report the changes and checks in the pull request.
          claude_args: |
            --max-turns 15
