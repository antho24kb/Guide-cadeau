<style>
  :root{--fond:#f6efe0;--encre:#2a2118;--rouge:#d9411e;--trait:#d8cdb4;--carte:#fffaf0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--fond);color:var(--encre);font-family:Georgia,"Times New Roman",serif;line-height:1.45}
  header{text-align:center;padding:28px 16px 12px;border-bottom:3px double var(--encre);margin:0 16px}
  h1{margin:0;font-size:30px;letter-spacing:2px;text-transform:uppercase}
  header p{margin:6px 0 0;font-style:italic}
  main{max-width:640px;margin:0 auto;padding:16px}
  .alertes{text-align:center;margin-bottom:12px}
  .alertes iframe{border:2px solid var(--encre)!important;background:var(--carte)}
  .alertes h2{margin:0 0 6px;font-size:20px}
  .alertes a.bouton{display:inline-block;margin-top:10px}
  .mois{font-weight:bold;font-size:20px;border-bottom:1px solid var(--encre);margin:24px 0 8px;text-transform:capitalize}
  .sb{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--carte);border:1px solid var(--trait);padding:12px;margin-bottom:8px}
  .sb .date{font-size:13px;color:#6b5d48}
  .sb .titre{font-weight:bold}
  a.bouton{background:var(--rouge);color:#fff;text-decoration:none;padding:10px 14px;font-family:Arial,sans-serif;font-size:14px;font-weight:bold;border-radius:4px;white-space:nowrap}
  .vide{text-align:center;font-style:italic;padding:24px}
  footer{text-align:center;font-size:12px;color:#6b5d48;padding:20px 16px 40px}
</style>

const liste = document.getElementById("liste");
if (!STEELBOOKS.length) {
  liste.innerHTML = '<p class="vide">Les prochaines sorties arrivent très bientôt.</p>';
} else {
  const tries = [...STEELBOOKS].sort((a, b) => a.date.localeCompare(b.date));
  let moisCourant = "";
  tries.forEach(s => {
    const d = new Date(s.date + "T12:00:00");
    const mois = d.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    if (mois !== moisCourant) {
      moisCourant = mois;
      const h = document.createElement("div");
      h.className = "mois";
      h.textContent = mois;
      liste.appendChild(h);
    }
    const jour = d.toLocaleDateString("fr-FR", { day: "numeric", month: "long" });
    const el = document.createElement("div");
    el.className = "sb";
    el.innerHTML = '<div><div class="date"></div><div class="titre"></div></div>' +
                   '<a class="bouton" target="_blank" rel="noopener sponsored">Voir sur Amazon</a>';
    el.querySelector(".date").textContent = jour;
    el.querySelector(".titre").textContent = s.titre;
    el.querySelector("a").href = s.lien;
    liste.appendChild(el);
  });
