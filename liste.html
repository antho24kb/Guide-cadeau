<style>

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { margin:0; background:var(--bg); color:var(--creme); font-family:-apple-system, "Helvetica Neue", Arial, sans-serif; padding-bottom:env(safe-area-inset-bottom); }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(14px + env(safe-area-inset-top)) 16px 10px; border-bottom:1px solid #26344f; }
h1 { margin:0; font-size:22px; letter-spacing:.5px; }
.score { display:flex; align-items:baseline; justify-content:space-between; margin-top:6px; }
.score b { font-size:30px; color:var(--or); }
.score span { font-size:14px; color:var(--gris); }
.bar { height:8px; background:#26344f; border-radius:4px; margin-top:8px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--or); transition:width .25s; }
main { padding:10px 12px 30px; display:flex; flex-direction:column; gap:8px; }
.row { display:flex; align-items:center; gap:12px; background:var(--row); border-radius:12px; padding:8px 12px 8px 8px; cursor:pointer; }
.img { width:64px; height:64px; border-radius:8px; overflow:hidden; flex-shrink:0; }
.txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.txt b { font-size:16px; line-height:1.2; }
.txt i { font-style:normal; font-size:13px; color:var(--or); font-weight:700; }
.row input { position:absolute; opacity:0; pointer-events:none; }
.box { width:36px; height:36px; border:2.5px solid var(--creme); border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.row input:checked ~ .box { background:var(--or); border-color:var(--or); }
.row input:checked ~ .box::after { content:""; width:10px; height:18px; border:solid var(--bg); border-width:0 4px 4px 0; transform:rotate(45deg) translate(-2px,-2px); }
.row:has(input:checked) { opacity:.7; }
footer { padding:6px 16px 36px; text-align:center; color:var(--gris); font-size:13px; line-height:1.5; }
button { margin-top:12px; background:none; border:1.5px solid var(--gris); color:var(--gris); border-radius:10px; padding:10px 16px; font-size:14px; }
</style>

<script>
(function () {
  var KEY = "films100";
  var boxes = Array.prototype.slice.call(document.querySelectorAll('input[type=checkbox]'));
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
  function maj() {
    var n = 0, s = {};
    boxes.forEach(function (b) { if (b.checked) { n++; s[b.dataset.i] = 1; } });
    document.getElementById("n").textContent = n;
    document.getElementById("p").style.width = n + "%";
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  boxes.forEach(function (b) { if (saved[b.dataset.i]) b.checked = true; b.addEventListener("change", maj); });
  document.getElementById("reset").addEventListener("click", function () {
    if (confirm("Tout décocher ?")) { boxes.forEach(function (b) { b.checked = false; }); maj(); }
  });
  maj();
})();
</script>
